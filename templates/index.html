
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboScape</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="robot">🤖</div>
        <h1>RoboScape</h1>
        <p>Escape room inteligent: fiecare etapă te apropie de evadare.</p>
    </header>

    <main>
        <section id="start-screen" class="panel">
            <h2>Misiunea începe aici</h2>
            <p>Introdu numele și încearcă să treci prin toate cele șase etape.</p>

            <form id="start-form">
                <label for="player-name">Numele jucătorului</label>
                <input id="player-name" maxlength="30"
                       placeholder="Scrie numele..." required>
                <button type="submit">Începe misiunea</button>
            </form>

            <p id="start-error" class="error"></p>
        </section>

        <section id="game-screen" class="panel hidden">
            <div class="game-top">
                <span id="player-label"></span>
                <span id="difficulty-label"></span>
            </div>

            <div class="progress-track">
                <div id="progress-bar"></div>
            </div>

            <p id="stage-counter"></p>
            <h2 id="stage-title"></h2>
            <p id="stage-description"></p>

            <div id="challenge"></div>
            <p id="game-message" role="status"></p>

            <button id="submit-answer">Verifică răspunsul</button>
        </section>

        <section id="finish-screen" class="panel hidden">
            <h2>🎉 Misiune finalizată!</h2>
            <p id="finish-message"></p>
            <button id="restart-button">Joacă din nou</button>
        </section>

        <section class="panel leaderboard-panel">
            <h2>Clasament</h2>
            <button id="leaderboard-button">Actualizează clasamentul</button>
            <ol id="leaderboard-list"></ol>
        </section>
    </main>

    <footer>
        <p>RoboScape · Un joc experimental cu dificultate adaptivă</p>
    </footer>

    <script src="/static/game.js" defer></script>
</body>
</html>
